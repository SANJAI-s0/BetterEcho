# BetterEcho — Render.com Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: betterecho-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # ── Render Plan ──────────────────────────────────────────────────────────
    plan: free

    # ── Health Check ──────────────────────────────────────────────────────────
    healthCheckPath: /

    # ── Auto Deploy on Git Push ───────────────────────────────────────────────
    autoDeploy: true

    # ── Environment Variables ─────────────────────────────────────────────────
    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: WHISPER_MODEL
        value: base

      - key: FLASK_ENV
        value: production
