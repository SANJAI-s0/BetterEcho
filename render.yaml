# BetterEcho — Render.com Deployment Configuration

services:
  - type: web
    name: betterecho-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    plan: free

    healthCheckPath: /

    autoDeploy: true

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: WHISPER_MODEL
        value: tiny

      - key: FLASK_ENV
        value: production
